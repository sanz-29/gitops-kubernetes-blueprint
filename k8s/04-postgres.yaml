# Initial schema: runs once, when the database is first created
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tasks-app
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
        id          SERIAL PRIMARY KEY,
        title       VARCHAR(200) NOT NULL,
        completed   BOOLEAN DEFAULT false,
        created_at  TIMESTAMPTZ DEFAULT NOW()
    );
    INSERT INTO tasks (title) VALUES ('Learn Docker'), ('Deploy to Kubernetes');
---
# The database itself: one pod, kept running by this Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tasks-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tasks-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasks-db-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: tasks-config
                  key: DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init
          configMap:
            name: postgres-init
---
# Stable name "postgres" that the backend connects to
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tasks-app
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
